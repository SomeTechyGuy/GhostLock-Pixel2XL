name: Build GhostLock (taimen aarch64)

on:
  push:
    branches: [ 4.4 ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install NDK r27d
        run: |
          NDK_VERSION="r27d"
          NDK_DIR="$HOME/.cache/android-ndk/android-ndk-$NDK_VERSION"
          if [ ! -d "$NDK_DIR" ]; then
            mkdir -p "$HOME/.cache/android-ndk"
            curl -fsSL -o /tmp/ndk.zip \
              "https://dl.google.com/android/repository/android-ndk-$NDK_VERSION-linux.zip"
            unzip -q /tmp/ndk.zip -d "$HOME/.cache/android-ndk"
            rm -f /tmp/ndk/zip
          fi
          echo "ANDROID_NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"

      - name: Build GhostLock
        run: |
          make NDK="$ANDROID_NDK_HOME" API=30 OUTDIR=build
          ls -la build/ghostlock_root

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ghostlock-taimen-aarch64
          path: build/ghostlock_root
          retention-days: 7
